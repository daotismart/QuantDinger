<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回测过程可视化</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --muted:#94a3b8; --line:#1f2937; --pri:#60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { padding: 14px 16px 24px; }
    body.embed .wrap { padding: 4px 2px 8px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    body.embed h1, body.embed .desc { display:none; }
    .desc { color: var(--muted); margin: 0 0 12px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    input, select { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
    button { background:var(--pri); color:#fff; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    .msg { color:var(--muted); min-height:18px; margin-bottom:8px; }
    .kpis { display:grid; grid-template-columns:repeat(6,minmax(110px,1fr)); gap:8px; margin-bottom:12px; }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    .kpi span { display:block; color:var(--muted); font-size:11px; }
    .kpi strong { font-size:18px; }
    .tabs { display:flex; gap:8px; margin-bottom:10px; }
    .tabs button { background:var(--card); color:var(--text); border:1px solid var(--line); }
    .tabs button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
    .panel { display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px 14px; }
    .panel.on { display:block; }
    .panel h2 { margin:0 0 6px; font-size:15px; }
    canvas { width:100%; height:320px; display:block; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin:6px 0 8px; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); }
    .pos { color: var(--ok); } .neg { color: var(--bad); }
    @media (max-width: 900px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>回测过程可视化</h1>
    <p class="desc">决策过程、成交信息与持仓变化。数据来自本次回测的 orderLedger / executions / holdingSnapshots（研究回测会做兼容重建）。</p>
    <div class="toolbar">
      <input id="runId" placeholder="回测 runId" style="width:120px" />
      <select id="history" style="min-width:260px"><option value="">从历史选择</option></select>
      <button id="load">加载</button>
      <button class="ghost" id="allTabs">同时显示三图</button>
    </div>
    <div class="msg" id="msg">等待回测结果…</div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
      <button class="on" data-tab="decision">决策过程</button>
      <button data-tab="fills">成交信息</button>
      <button data-tab="positions">持仓信息</button>
    </div>
    <section class="panel on" id="decision">
      <h2>决策过程</h2>
      <div class="legend">
        <span><i class="dot" style="background:#16a34a"></i>开仓</span>
        <span><i class="dot" style="background:#dc2626"></i>平仓</span>
        <span><i class="dot" style="background:#d97706"></i>风控</span>
        <span><i class="dot" style="background:#2563eb"></i>调仓</span>
        <span><i class="dot" style="background:#7c3aed"></i>拒绝/延迟</span>
      </div>
      <canvas id="decisionChart" height="320"></canvas>
      <div style="overflow:auto;max-height:220px"><table><thead><tr><th>时间</th><th>类型</th><th>标的</th><th>原因</th></tr></thead><tbody id="decisionBody"></tbody></table></div>
    </section>
    <section class="panel" id="fills">
      <h2>成交信息</h2>
      <div class="legend">
        <span><i class="dot" style="background:#16a34a"></i>买入名义</span>
        <span><i class="dot" style="background:#dc2626"></i>卖出名义</span>
        <span><i class="dot" style="background:#2563eb"></i>累计已实现盈亏</span>
      </div>
      <canvas id="fillChart" height="320"></canvas>
      <div style="overflow:auto;max-height:220px"><table><thead><tr><th>时间</th><th>方向</th><th>标的</th><th>数量</th><th>价格</th><th>名义</th><th>原因</th></tr></thead><tbody id="fillBody"></tbody></table></div>
    </section>
    <section class="panel" id="positions">
      <h2>持仓信息</h2>
      <div class="legend">
        <span><i class="dot" style="background:#2563eb"></i>持仓数量</span>
        <span><i class="dot" style="background:#0ea5e9"></i>现金</span>
        <span><i class="dot" style="background:#d97706"></i>毛敞口</span>
      </div>
      <canvas id="posChart" height="320"></canvas>
      <div style="overflow:auto;max-height:220px"><table><thead><tr><th>时间</th><th>标的</th><th>数量</th><th>市值</th><th>权重</th><th>现金</th></tr></thead><tbody id="posBody"></tbody></table></div>
    </section>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("embed") === "1") document.body.classList.add("embed");

    function token() {
      for (const key of ["Access-Token", "token", "Authorization"]) {
        let raw = localStorage.getItem(key);
        if (!raw) continue;
        try { const parsed = JSON.parse(raw); if (parsed && typeof parsed === "object") return parsed.value || parsed.token || ""; } catch (e) {}
        return raw;
      }
      return "";
    }
    async function api(path) {
      const headers = { Accept: "application/json" };
      const t = token();
      if (t) { headers.Authorization = "Bearer " + t; headers["Access-Token"] = t; }
      const res = await fetch(path, { headers, credentials: "include" });
      if (!res.ok) throw new Error(path + " HTTP " + res.status);
      return res.json();
    }
    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const timeOf = (v) => {
      const s = String(v || "").trim();
      if (!s) return "";
      return s.indexOf("T") >= 0 ? s : s.slice(0, 10) + "T16:00:00Z";
    };
    function list(v) { return Array.isArray(v) ? v : []; }

    function buildViz(result) {
      if (result && result.visualization && Array.isArray(result.visualization.decisionProcess)) return result.visualization;
      const decisions = [];
      list(result.protectionEvents).forEach((item) => decisions.push({ time: timeOf(item.time), kind: "protect", symbol: item.symbol || "", reason: item.reason || "protection", label: item.reason || "protection" }));
      list(result.rebalanceRecords).forEach((item) => decisions.push({ time: timeOf(item.time), kind: "rebalance", symbol: "", reason: "rebalance", label: "rebalance" }));
      list(result.orderLedger).forEach((item) => {
        const st = String(item.status || "").toLowerCase();
        if (["rejected", "deferred", "partial"].includes(st)) decisions.push({ time: timeOf(item.eventTime || item.time), kind: st, symbol: item.symbol || "", reason: item.statusReason || st, label: item.statusReason || st });
      });
      list(result.closedTrades || result.trades).forEach((item) => {
        decisions.push({ time: timeOf(item.entry_time || item.entryDate), kind: "enter", symbol: item.symbol || "", reason: "entry", label: "entry" });
        decisions.push({ time: timeOf(item.exit_time || item.exitDate), kind: "exit", symbol: item.symbol || "", reason: item.close_reason || item.reason || "exit", label: item.close_reason || item.reason || "exit" });
      });
      let fills = list(result.executions || result.rawTrades).map((item) => ({
        time: timeOf(item.time || item.signal_time), side: String(item.side || "buy").toLowerCase() === "short" ? "sell" : (String(item.side || "buy").toLowerCase() === "long" ? "buy" : String(item.side || "buy").toLowerCase()),
        symbol: item.symbol || "", quantity: Math.abs(num(item.quantity)), price: num(item.price), notional: num(item.notional) || Math.abs(num(item.quantity)) * num(item.price), commission: num(item.commission), status: item.status || "filled", reason: item.reason || "", cumulativePnl: 0
      }));
      if (!fills.length) {
        list(result.closedTrades || result.trades).forEach((item) => {
          const qty = Math.abs(num(item.quantity || item.amount || 1));
          const short = String(item.side || "").toLowerCase() === "short";
          fills.push({ time: timeOf(item.entry_time || item.entryDate), side: short ? "sell" : "buy", symbol: item.symbol || "", quantity: qty, price: num(item.entry_price || item.entryCredit), notional: qty * Math.abs(num(item.entry_price || item.entryCredit)), reason: "entry", cumulativePnl: 0 });
          fills.push({ time: timeOf(item.exit_time || item.exitDate), side: short ? "buy" : "sell", symbol: item.symbol || "", quantity: qty, price: num(item.exit_price || item.exitDebit), notional: qty * Math.abs(num(item.exit_price || item.exitDebit)), reason: item.close_reason || item.reason || "exit", profit: num(item.profit || item.pnl), cumulativePnl: 0 });
        });
      }
      fills = fills.filter((x) => x.time).sort((a, b) => a.time.localeCompare(b.time));
      let pnl = 0;
      fills.forEach((x) => { pnl += num(x.profit); x.cumulativePnl = pnl; });
      let positions = [];
      list(result.holdingSnapshots).forEach((snap) => {
        const pos = snap.positions || {};
        const keys = Object.keys(pos);
        if (!keys.length) positions.push({ time: timeOf(snap.time), symbol: "", quantity: 0, marketValue: 0, weight: 0, cash: num(snap.cash), grossExposure: num(snap.grossExposure) });
        keys.forEach((sym) => positions.push({ time: timeOf(snap.time), symbol: sym, quantity: num(pos[sym].quantity || pos[sym].amount), marketValue: num(pos[sym].marketValue), weight: num(pos[sym].weight), cash: num(snap.cash), grossExposure: num(snap.grossExposure) }));
      });
      if (!positions.length) {
        const trades = list(result.closedTrades || result.trades);
        list(result.equityCurve).forEach((pt) => {
          const t = timeOf(pt.time || pt.date);
          let qty = 0;
          trades.forEach((tr) => {
            const a = timeOf(tr.entry_time || tr.entryDate);
            const b = timeOf(tr.exit_time || tr.exitDate);
            if (a && a <= t && (!b || b > t)) qty += Math.abs(num(tr.quantity || tr.amount || 1));
          });
          positions.push({ time: t, symbol: (trades[0] && trades[0].symbol) || "", quantity: qty, marketValue: 0, weight: 0, cash: num(pt.cash != null ? pt.cash : pt.value || pt.equity), grossExposure: num(pt.grossExposure) });
        });
      }
      return { decisionProcess: decisions.filter((x) => x.time), fills, positions, summaries: {} };
    }

    function resizeCanvas(c) {
      const dpr = window.devicePixelRatio || 1;
      const w = c.clientWidth || 640, h = c.clientHeight || 320;
      c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w, h };
    }
    function axis(ctx, w, h, pad) {
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line") || "#e2e8f0";
      ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h - pad.b); ctx.lineTo(w - pad.r, h - pad.b); ctx.stroke();
    }
    function xOf(t, times, pad, w) {
      if (times.length <= 1) return pad.l + (w - pad.l - pad.r) / 2;
      const a = Date.parse(times[0]), b = Date.parse(times[times.length - 1]);
      const p = (Date.parse(t) - a) / Math.max(b - a, 1);
      return pad.l + p * (w - pad.l - pad.r);
    }
    function yOf(v, min, max, pad, h) {
      const span = max - min || 1;
      return h - pad.b - ((v - min) / span) * (h - pad.t - pad.b);
    }
    function drawScatter(canvas, points, lanes, colors) {
      const { ctx, w, h } = resizeCanvas(canvas);
      const pad = { l: 46, r: 16, t: 16, b: 28 };
      axis(ctx, w, h, pad);
      const times = points.map((p) => p.time).filter(Boolean).sort();
      lanes.forEach((lane, i) => {
        const y = pad.t + ((i + 0.5) / lanes.length) * (h - pad.t - pad.b);
        ctx.fillStyle = "#94a3b8"; ctx.font = "11px sans-serif"; ctx.fillText(lane, 6, y + 3);
      });
      points.forEach((p) => {
        const lane = Math.max(0, lanes.indexOf(p.kind));
        const x = xOf(p.time, times, pad, w);
        const y = pad.t + ((lane + 0.5) / lanes.length) * (h - pad.t - pad.b);
        ctx.fillStyle = colors[p.kind] || "#64748b";
        ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
      });
    }
    function drawCombo(canvas, bars, line) {
      const { ctx, w, h } = resizeCanvas(canvas);
      const pad = { l: 52, r: 16, t: 16, b: 28 };
      axis(ctx, w, h, pad);
      const times = [...bars, ...line].map((p) => p.time).filter(Boolean).sort();
      const ys = bars.map((p) => p.y).concat(line.map((p) => p.y));
      const min = Math.min(0, ...ys), max = Math.max(1, ...ys);
      const bw = Math.max(3, (w - pad.l - pad.r) / Math.max(times.length, 8) * 0.55);
      bars.forEach((p) => {
        const x = xOf(p.time, times, pad, w);
        const y0 = yOf(0, min, max, pad, h), y1 = yOf(p.y, min, max, pad, h);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.75;
        ctx.fillRect(x - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0) || 1);
        ctx.globalAlpha = 1;
      });
      ctx.strokeStyle = "#2563eb"; ctx.lineWidth = 2; ctx.beginPath();
      line.forEach((p, i) => {
        const x = xOf(p.time, times, pad, w), y = yOf(p.y, min, max, pad, h);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
    function drawLines(canvas, series) {
      const { ctx, w, h } = resizeCanvas(canvas);
      const pad = { l: 52, r: 16, t: 16, b: 28 };
      axis(ctx, w, h, pad);
      const times = series.flatMap((s) => s.points.map((p) => p.time)).filter(Boolean).sort();
      const ys = series.flatMap((s) => s.points.map((p) => p.y));
      const min = Math.min(0, ...ys), max = Math.max(1, ...ys);
      series.forEach((s) => {
        ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
        s.points.forEach((p, i) => {
          const x = xOf(p.time, times, pad, w), y = yOf(p.y, min, max, pad, h);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
    }

    function fmt(n, d = 2) { return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: d }); }
    function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    function render(viz, meta) {
      const decisions = viz.decisionProcess || [];
      const fills = viz.fills || [];
      const positions = viz.positions || [];
      document.getElementById("kpis").innerHTML = [
        ["决策事件", decisions.length],
        ["成交笔数", fills.length],
        ["持仓点", positions.length],
        ["买入", fills.filter((x) => x.side === "buy").length],
        ["卖出", fills.filter((x) => x.side === "sell").length],
        ["累计盈亏", fmt(fills.length ? fills[fills.length - 1].cumulativePnl : 0)],
      ].map(([k, v]) => `<div class="kpi"><span>${k}</span><strong>${v}</strong></div>`).join("");
      const colors = { enter: "#16a34a", exit: "#dc2626", protect: "#d97706", rebalance: "#2563eb", rejected: "#7c3aed", deferred: "#7c3aed", partial: "#f59e0b", log: "#64748b" };
      const lanes = ["enter", "exit", "protect", "rebalance", "rejected", "deferred", "partial"];
      drawScatter(document.getElementById("decisionChart"), decisions, lanes, colors);
      drawCombo(
        document.getElementById("fillChart"),
        fills.map((x) => ({ time: x.time, y: x.side === "sell" ? -Math.abs(x.notional) : Math.abs(x.notional), color: x.side === "sell" ? "#dc2626" : "#16a34a" })),
        fills.map((x) => ({ time: x.time, y: x.cumulativePnl }))
      );
      const byTime = {};
      positions.forEach((p) => {
        byTime[p.time] = byTime[p.time] || { time: p.time, qty: 0, cash: p.cash, gross: p.grossExposure };
        byTime[p.time].qty += Math.abs(num(p.quantity));
        byTime[p.time].cash = p.cash;
        byTime[p.time].gross = p.grossExposure;
      });
      const posRows = Object.values(byTime).sort((a, b) => a.time.localeCompare(b.time));
      drawLines(document.getElementById("posChart"), [
        { color: "#2563eb", points: posRows.map((p) => ({ time: p.time, y: p.qty })) },
        { color: "#0ea5e9", points: posRows.map((p) => ({ time: p.time, y: p.cash })) },
        { color: "#d97706", points: posRows.map((p) => ({ time: p.time, y: p.gross * (posRows[0] && posRows[0].qty ? posRows[0].qty : 1) })) },
      ]);
      document.getElementById("decisionBody").innerHTML = decisions.slice(-80).reverse().map((r) => `<tr><td>${esc(r.time)}</td><td>${esc(r.kind)}</td><td>${esc(r.symbol)}</td><td>${esc(r.label || r.reason)}</td></tr>`).join("");
      document.getElementById("fillBody").innerHTML = fills.slice(-80).reverse().map((r) => `<tr><td>${esc(r.time)}</td><td class="${r.side === "sell" ? "neg" : "pos"}">${esc(r.side)}</td><td>${esc(r.symbol)}</td><td>${fmt(r.quantity, 4)}</td><td>${fmt(r.price, 4)}</td><td>${fmt(r.notional)}</td><td>${esc(r.reason)}</td></tr>`).join("");
      document.getElementById("posBody").innerHTML = positions.slice(-80).reverse().map((r) => `<tr><td>${esc(r.time)}</td><td>${esc(r.symbol)}</td><td>${fmt(r.quantity, 4)}</td><td>${fmt(r.marketValue)}</td><td>${(num(r.weight) * 100).toFixed(2)}%</td><td>${fmt(r.cash)}</td></tr>`).join("");
      document.getElementById("msg").textContent = (meta && meta.strategy_name ? meta.strategy_name + " · " : "") + "run #" + (meta && (meta.id || meta.runId) || params.get("runId") || "-");
    }

    async function loadRun(runId) {
      document.getElementById("msg").textContent = "加载中…";
      const data = await api("/api/backtest/get?runId=" + encodeURIComponent(runId));
      const row = data.data || data;
      const result = row.result || row;
      render(buildViz(result), row);
    }
    async function loadHistory() {
      try {
        const data = await api("/api/backtest/history?limit=40");
        const rows = data.data || [];
        const sel = document.getElementById("history");
        rows.forEach((r) => {
          const o = document.createElement("option");
          o.value = r.id; o.textContent = "#" + r.id + " " + (r.strategy_name || "");
          sel.appendChild(o);
        });
      } catch (e) {}
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("on"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("on"));
        btn.classList.add("on");
        document.getElementById(btn.dataset.tab).classList.add("on");
        window.dispatchEvent(new Event("resize"));
      };
    });
    document.getElementById("allTabs").onclick = () => {
      document.querySelectorAll(".panel").forEach((p) => p.classList.add("on"));
    };
    document.getElementById("load").onclick = () => {
      const id = document.getElementById("runId").value || document.getElementById("history").value;
      if (id) loadRun(id).catch((e) => { document.getElementById("msg").textContent = "加载失败：" + e.message; });
    };
    document.getElementById("history").onchange = () => {
      if (document.getElementById("history").value) {
        document.getElementById("runId").value = document.getElementById("history").value;
        document.getElementById("load").click();
      }
    };
    window.addEventListener("resize", () => {
      const id = document.getElementById("runId").value;
      if (id && window.__last) render(window.__last.viz, window.__last.meta);
    });
    const orig = render;
    render = (viz, meta) => { window.__last = { viz, meta }; orig(viz, meta); };

    loadHistory();
    const initial = params.get("runId");
    if (initial) {
      document.getElementById("runId").value = initial;
      loadRun(initial).catch((e) => { document.getElementById("msg").textContent = "加载失败：" + e.message + "（请先登录回测中心）"; });
    }
  </script>
</body>
</html>
